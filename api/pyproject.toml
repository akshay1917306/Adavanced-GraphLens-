[project]
name = "graphlens-api"
version = "0.0.1"
description = "GraphLens API: health checks, schema migrations and (later) query endpoints"
requires-python = ">=3.11,<3.12"
dependencies = [
    "alembic==1.20.0",
    "argon2-cffi==25.1.0",  # password and recovery-code hashing (argon2id), MIT
    "fastapi==0.156.7",
    "httpx==0.28.1",
    "neo4j==6.4.1",
    "psycopg[binary]==3.3.6",
    "pydantic-settings==2.16.1",
    "pycparser==3.0",  # pulled in by cffi; pinned older than the newest because 3.12 is under two weeks old
    "pyyaml==6.0.3",
    "redis==8.1.0",
    "sqlalchemy==2.1.5",
    "uvicorn[standard]==0.54.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.isort]
known-third-party = ["alembic"]  # our alembic/ folder is not the alembic package

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]  # fake passwords in tests are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs a running Postgres (set DATABASE_URL)"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
