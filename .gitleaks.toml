title = "GraphLens secret scan"

[extend]
useDefault = true

# Fake keys that the tests use on purpose to prove that real-looking keys are redacted, and the
# placeholder in .env.example. Only these exact strings are allowed; any other key-like string
# anywhere in the repository (or its history) still fails the scan.
[allowlist]
description = "Fake test keys and the example placeholder"
regexes = [
  '''sk-proj-abcdEFGH1234567890xyz''',
  '''sk-abcdefghijklmnopqrstuvwx''',
  '''sk-placeholder-not-a-real-key''',
  # made-up token in pipeline/tests/test_linking.py (sanitiser test)
  '''a1b2c3d4e5f6a7b8c9d0e1f2a3b4c5d6e7''',
]
