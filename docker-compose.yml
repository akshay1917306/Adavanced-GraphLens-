# Local development stack for GraphLens (Phase 0).
# Every port is bound to 127.0.0.1 so nothing is exposed to your network.
# Start:  docker compose up -d --build
# Stop:   docker compose down        (add -v to also delete the data volumes)

name: graphlens

services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  neo4j:
    image: neo4j:5.26.12-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:?set NEO4J_PASSWORD in .env}
      NEO4J_server_memory_heap_initial__size: 512m
      NEO4J_server_memory_heap_max__size: 1g
      NEO4J_server_memory_pagecache_size: 512m
    ports:
      - "127.0.0.1:${NEO4J_HTTP_PORT:-7474}:7474"
      - "127.0.0.1:${NEO4J_BOLT_PORT:-7687}:7687"
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  qdrant:
    image: qdrant/qdrant:v1.15.4
    ports:
      - "127.0.0.1:${QDRANT_PORT:-6333}:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    healthcheck:
      # The qdrant image has no curl or wget, so use bash's /dev/tcp.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && printf \"GET /readyz HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q \"200 OK\" <&3'"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7.4.6-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      QDRANT_URL: http://qdrant:6333
      REDIS_URL: redis://redis:6379/0
      ADMIN_API_KEY: ${ADMIN_API_KEY:-}
      ANSWER_MODE: ${ANSWER_MODE:-replay}
      VISITOR_TOKEN_SECRET: ${VISITOR_TOKEN_SECRET:-}
      PROXY_SECRET: ${PROXY_SECRET:-}
      RATE_ASK_PER_MIN: ${RATE_ASK_PER_MIN:-10}
      RATE_ASK_PER_DAY: ${RATE_ASK_PER_DAY:-100}
      RATE_ASK_IP_PER_MIN: ${RATE_ASK_IP_PER_MIN:-30}
      RATE_GENERAL_PER_MIN: ${RATE_GENERAL_PER_MIN:-120}
      RATE_VISITOR_IP_PER_MIN: ${RATE_VISITOR_IP_PER_MIN:-10}
      DAILY_COST_CAP_USD: ${LLM_DAILY_COST_CAP_USD:-1.0}
      INDEX_VERSION: ${INDEX_VERSION:-idx2-full-g0}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      API_URL: http://api:8000
      COOKIE_SECURE: ${COOKIE_SECURE:-}
      PROXY_SECRET: ${PROXY_SECRET:-}
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    depends_on:
      - api

  # Optional local model server (no OpenAI key, no cost). Start with:
  #   docker compose --profile local-llm up -d ollama
  # then set LLM_BASE_URL=http://ollama:11434/v1 and LLM_MODEL_* to the pulled model in .env.
  ollama:
    image: ollama/ollama:0.12.6
    profiles: ["local-llm"]
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "127.0.0.1:11434:11434"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Pipeline tools. Not started by `docker compose up`; run on demand:
  #   docker compose run --rm pipeline ingest
  pipeline:
    build: ./pipeline
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      QDRANT_URL: http://qdrant:6333
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: ${NEO4J_PASSWORD}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      LLM_MODEL_MAIN: ${LLM_MODEL_MAIN:-}
      LLM_MODEL_SMALL: ${LLM_MODEL_SMALL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      GIT_SHA: ${GIT_SHA:-unknown}
      # Prefect starts a small temporary server for each flow run. On a busy or low-memory
      # machine that can take longer than the default 20 seconds.
      PREFECT_SERVER_EPHEMERAL_STARTUP_TIMEOUT_SECONDS: "120"
      SCHEMA_SQL: /schema/0001_initial_schema.sql
    volumes:
      - ./data:/data:ro
      - ./ontology:/ontology:ro
      - ./api/alembic/versions:/schema:ro
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      neo4j:
        condition: service_healthy

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
  ollama_data:
