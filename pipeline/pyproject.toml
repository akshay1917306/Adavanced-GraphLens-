[project]
name = "graphlens-pipeline"
version = "0.0.1"
description = "GraphLens indexing pipeline: ingest, chunk and (later) embed, extract and build the graph"
requires-python = ">=3.11,<3.12"
dependencies = [
    # Prefect 3.8.8 needs FastAPI 0.139 or newer, but its server code calls Body(min_items=...),
    # which FastAPI 0.156 and newer reject. So stay between 0.139 and 0.155 until Prefect is
    # upgraded. (0.145 was tested to accept it; this version is older than two weeks.)
    "fastapi==0.143.0",
    "fastembed==0.9.0",  # local embeddings (ONNX), Apache-2.0
    "fonttools==4.66.1",  # lets pypdf decode the encoding of embedded fonts (math symbols)
    "neo4j==5.28.2",  # official Neo4j driver (bolt), same major version as the server (5.26)
    "graspologic-native==1.3.1",  # hierarchical Leiden (the Rust core of graspologic, no heavy deps)
    "numpy==2.4.6",
    "openai==3.28.0",  # the only code that calls OpenAI is graphlens_pipeline/llm.py
    "prefect==3.8.8",  # runs the stages as a flow with retries (Apache-2.0)
    "psycopg[binary]==3.3.6",
    "pydantic==2.14.1",
    "pypdf==6.19.0",
    "pyyaml==6.0.3",
    "qdrant-client==1.15.1",  # same minor version as the Qdrant server (v1.15.4)
    "sqlalchemy==2.1.5",
    "tiktoken==0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]  # fake passwords and test-only SQL are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "integration: needs the Postgres and Qdrant containers; uses its own throwaway database and collections",
    "model: loads the real local embedding models (baked into the Docker image)",
]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
