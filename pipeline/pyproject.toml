[project]
name = "graphlens-pipeline"
version = "0.0.1"
description = "GraphLens indexing pipeline: ingest, chunk and (later) embed, extract and build the graph"
requires-python = ">=3.11,<3.12"
dependencies = [
    "fonttools==4.66.1",  # lets pypdf decode the encoding of embedded fonts (math symbols)
    "psycopg[binary]==3.3.6",
    "pypdf==6.19.0",
    "sqlalchemy==2.1.5",
    "tiktoken==0.14.0",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]  # assert is fine in tests

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S608"]  # fake passwords and test-only SQL are intentional

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the Postgres container (DATABASE_URL); uses its own throwaway database"]

[dependency-groups]
dev = [
    "pytest==9.1.1",
    "ruff==0.17.1",
]
