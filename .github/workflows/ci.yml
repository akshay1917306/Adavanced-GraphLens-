name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: api
    services:
      postgres:
        image: postgres:16.10-alpine
        env:
          POSTGRES_USER: graphlens
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: graphlens
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U graphlens"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://graphlens:ci-only-password@localhost:5432/graphlens
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -v
      - run: uv run python -m app.fixtures --check

  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm run typecheck

  pipeline:
    # Builds the pipeline image (this downloads the local embedding models, about 300 MB),
    # starts Postgres, Qdrant and Neo4j, then runs the linter and the whole test suite inside it.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose --profile tools build pipeline
      - run: docker compose up -d --wait postgres qdrant neo4j
      - run: docker compose run --rm --no-deps --entrypoint ruff pipeline check --no-cache .
      - run: docker compose run --rm --no-deps --entrypoint ruff pipeline format --check --no-cache .
      - run: docker compose run --rm --entrypoint pytest pipeline -v -p no:cacheprovider
      - if: failure()
        run: docker compose logs --no-color postgres qdrant neo4j | tail -n 80

  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose config --quiet

  secrets:
    # Scans the files and the whole git history for keys, tokens and private keys.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2
          detect --source /repo --config /repo/.gitleaks.toml --redact --no-banner --verbose

  audit:
    # Known advisories in the web and API packages. The pipeline is audited by hand (see
    # docs/phases/phase-6-hardening/AUDIT.md) because two findings are accepted on purpose.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm audit --omit=dev --audit-level=high
        working-directory: web
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.11.32"
      - run: uv export --frozen --no-hashes --no-dev --no-emit-project --project api -o "$RUNNER_TEMP/req-api.txt"
      - run: uvx pip-audit -r "$RUNNER_TEMP/req-api.txt" --no-deps --disable-pip
